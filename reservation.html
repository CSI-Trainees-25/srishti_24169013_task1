<main>
  
  <section id="reservation" class="container">
  <h2 class="section-title">Make a Reservation</h2>
  <p class="section-subtitle">Secure your table for an unforgettable dining experience.</p>
  
  <form class="reservation-table">
  <div class="group">
  <label for="name">Full Name</label>
  <input type="text" id="name" name="name" required>
  </div>
  <div class="group">
  <label for="contact">Contact</label>
  <input type="number" id="number" name="number" required>
  </div>
  <div class="group">
  <label for="email">Email</label>
  <input type="email" id="email" name="email" required>
  </div>
  <div class="group">
  <label for="date">Date</label>
  <input type="date" id="date" name="date" required>
  </div>
  <div class="group">
  <label for="time">Time</label>
  <input type="time" id="time" name="time" required>
  </div>
  <div class="group">
  <label for="guests">Number of Guests</label>
  <select id="guests" name="guests">
  <option>1</option>
  <option>2</option>
  <option>3</option>
  <option>4</option>
  <option>More than 4</option>
  </select>
  </div>
  <button class="button">Reserve a Table</button>
  </form>
  
  </section>
  </main>
